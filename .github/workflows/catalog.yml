name: Catalogo de mods

on:
  pull_request:
    paths:
      - "mods/**"
      - ".github/scripts/build_catalog.py"
  push:
    branches: [main]
    paths:
      - "mods/**"
      - ".github/scripts/build_catalog.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar mods
        run: python .github/scripts/build_catalog.py --check

      - name: Regenerar catalog.json
        if: github.event_name != 'pull_request'
        run: |
          python .github/scripts/build_catalog.py
          if git diff --quiet -- catalog.json; then
            echo "Sin cambios en el catalogo."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "Actualizar catalog.json"
          git push
