name: Release del gestor

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publicar
        shell: bash
        run: |
          VERSION_ARGS=()
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then VERSION_ARGS=(-p:Version="${GITHUB_REF_NAME#v}"); fi
          dotnet publish gestor -c Release -r win-x64 -o dist/win -p:GitHubClientId="${{ vars.GITHUB_CLIENT_ID }}" "${VERSION_ARGS[@]}"
          mv dist/win/SanabiGestor.exe dist/SanabiGestor-windows-x64.exe
          cp dist/win/LICENSE-NotoSansSC.txt dist/LICENSE-NotoSansSC.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/SanabiGestor-windows-x64.exe
            dist/LICENSE-NotoSansSC.txt

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: AppImage
        env:
          SANABI_GESTOR_GITHUB_CLIENT_ID: ${{ vars.GITHUB_CLIENT_ID }}
        run: bash gestor/packaging/linux/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/SanabiGestor-x86_64.AppImage

  release:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "SANABI Gestor $GITHUB_REF_NAME" \
            --notes "Descarga el .exe (Windows) o el .AppImage (Linux). Es portable: no se instala. El gestor avisa sobre releases nuevas desde Actualizaciones y verifica SHA-256 antes de actualizar."
